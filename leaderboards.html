    <script>
      // TODO: Replace with your Firebase config
      const firebaseConfig = {
        apiKey: "AIzaSyD-Q2woACHgMCTVwd6aX-IUzLovE0ux-28",
        authDomain: "sci-high-website.firebaseapp.com",
        databaseURL: "https://sci-high-website-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "sci-high-website",
        storageBucket: "sci-high-website.appspot.com",
        messagingSenderId: "451463202515",
        appId: "1:451463202515:web:e7f9c7bf69c04c685ef626"
    };
      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      // Fetch leaderboard data with filter
      function renderLeaderboard(data) {
        const container = document.getElementById('leaderboard-list');
        if (!data || data.length === 0) {
          container.innerHTML = '<p class="text-gray-500">No scores yet.</p>';
          return;
        }
        let html = `<table class="w-full text-left mt-4"><thead><tr><th class="py-2 px-4 text-dark">Rank</th><th class="py-2 px-4 text-dark">Name</th><th class="py-2 px-4 text-dark">Score</th><th class="py-2 px-4 text-dark">Department</th></tr></thead><tbody>`;
        let rank = 1;
        data.forEach(entry => {
          const playerNameHtml = entry.userId 
            ? `<button class="player-name-link text-primary hover:text-accent underline cursor-pointer font-medium" onclick="showPlayerProfile('${entry.userId}')">${entry.name}</button>`
            : entry.name;
          html += `<tr class="border-b border-light"><td class="py-2 px-4">${rank++}</td><td class="py-2 px-4">${playerNameHtml}</td><td class="py-2 px-4">${entry.score}</td><td class="py-2 px-4">${entry.department ? entry.department : '-'}</td></tr>`;
        });
        html += '</tbody></table>';
        container.innerHTML = html;
      }

      function addScore(userId, name, score, department) {
        return new Promise((resolve, reject) => {
          // Validate input
          if (!userId || !name || score < 0) {
            reject(new Error('Invalid score data'));
            return;
          }
          
          // Create sample gameData for testing
          const gameData = {
            totalPoints: score,
            topicPoints: {
              'python': Math.floor(score * (0.25 + Math.random() * 0.15)), // 25-40%
              'java': Math.floor(score * (0.20 + Math.random() * 0.15)),   // 20-35%
              'C_sharp_': Math.floor(score * (0.15 + Math.random() * 0.15)), // 15-30%
              'webdesign': Math.floor(score * (0.15 + Math.random() * 0.10)), // 15-25%
              'C': Math.floor(score * (0.10 + Math.random() * 0.10)),      // 10-20%
              'C_plus_plus_': Math.floor(score * (0.05 + Math.random() * 0.10)) // 5-15%
            },
            achievementCount: Math.floor(Math.random() * 8) + 2, // 2-10 achievements
            playTime: Math.floor(Math.random() * 7200) + 1800, // 30 min to 2 hours
            courseProgress: {
              'intro_to_programming': true,
              'data_structures': Math.random() > 0.3,
              'web_development': Math.random() > 0.4,
              'algorithms': Math.random() > 0.6,
              'advanced_topics': Math.random() > 0.8,
              'software_engineering': Math.random() > 0.7
            }
          };
          
          db.ref('leaderboards/' + userId).set({
            name: name,
            score: score,
            department: department,
            timestamp: Date.now(),
            submissionDate: new Date().toISOString(),
            gameData: gameData
          }).then(() => {
            console.log('Score submitted successfully');
            resolve();
          }).catch((error) => {
            console.error('Error submitting score:', error);
            reject(error);
          });
        });
      }

      // Enhanced function to update existing score if it's higher
      function updateBestScore(userId, name, score, department) {
        return new Promise((resolve, reject) => {
          db.ref('leaderboards/' + userId).once('value').then((snapshot) => {
            const existingData = snapshot.val();
            
            if (!existingData || score > existingData.score) {
              // Add new score or update if higher
              addScore(userId, name, score, department)
                .then(() => {
                  console.log('New best score saved!');
                  resolve(true); // Indicates new best score
                })
                .catch(reject);
            } else {
              console.log('Score not high enough to update leaderboard');
              resolve(false); // Indicates score wasn't updated
            }
          }).catch(reject);
        });
      }

      // Function to get a player's current best score
      function getPlayerBestScore(userId) {
        return new Promise((resolve, reject) => {
          db.ref('leaderboards/' + userId).once('value').then((snapshot) => {
            const data = snapshot.val();
            resolve(data ? data.score : 0);
          }).catch(reject);
        });
      }

      function fetchLeaderboard(filter) {
        db.ref('leaderboards').orderByChild('score').limitToLast(100).once('value', snapshot => {
          const arr = [];
          snapshot.forEach(child => {
            const data = child.val();
            data.userId = child.key; // Add the Firebase key as userId
            arr.push(data);
          });
          // Sort descending
          arr.sort((a, b) => b.score - a.score);
          let filtered = arr;
          if (filter === 'college') {
            filtered = arr.filter(e => (e.department || '').toLowerCase().includes('college'));
          } else if (filter === 'seniorhigh') {
            filtered = arr.filter(e => (e.department || '').toLowerCase().includes('senior'));
          } else if (filter === 'juniorhigh') {
            filtered = arr.filter(e => (e.department || '').toLowerCase().includes('junior'));
          }
          renderLeaderboard(filtered);
        });
      }

      // Filter button logic
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('bg-primary', 'text-dark'));
          this.classList.add('bg-primary', 'text-dark');
          fetchLeaderboard(this.dataset.filter);
        });
      });

      // Initial load: overall
      fetchLeaderboard('overall');

      // Make functions globally accessible for game integration
      window.leaderboardAPI = {
        addScore,
        updateBestScore,
        getPlayerBestScore,
        fetchLeaderboard
      };

      // Player Profile Functions
      function showPlayerProfile(userId) {
        console.log('Loading profile for user:', userId);
        
        // Show modal with animation
        const modal = document.getElementById('player-profile-modal');
        modal.classList.remove('hidden');
        modal.querySelector('.bg-white').classList.add('modal-enter');
        
        // Show loading state
        document.getElementById('profile-content').innerHTML = '<p class="text-center text-gray-500">Loading player profile...</p>';
        
        // Fetch player data
        db.ref('leaderboards/' + userId).once('value').then(snapshot => {
          const playerData = snapshot.val();
          if (playerData) {
            renderPlayerProfile(playerData);
          } else {
            document.getElementById('profile-content').innerHTML = '<p class="text-center text-red-500">Player profile not found.</p>';
          }
        }).catch(error => {
          console.error('Error loading player profile:', error);
          document.getElementById('profile-content').innerHTML = '<p class="text-center text-red-500">Error loading player profile.</p>';
        });
      }

      function closePlayerProfile() {
        // Destroy all active charts before closing
        activeCharts.forEach(chart => {
          if (chart && typeof chart.destroy === 'function') {
            chart.destroy();
          }
        });
        activeCharts = [];
        
        document.getElementById('player-profile-modal').classList.add('hidden');
      }

      function renderPlayerProfile(playerData) {
        // Restore sanitized Firebase keys if they exist
        const gameData = playerData.gameData || {};
        const topicPoints = restoreFirebaseKeys(gameData.topicPoints || {});
        
        // Calculate additional stats
        const submissionDate = playerData.submissionDate ? new Date(playerData.submissionDate).toLocaleDateString() : 'Unknown';
        const playTimeFormatted = formatPlayTime(gameData.playTime || 0);
        
        // Calculate derived statistics
        const totalTopicPoints = Object.values(topicPoints).reduce((sum, points) => sum + points, 0);
        const averageTopicScore = totalTopicPoints > 0 ? Math.round(totalTopicPoints / Object.keys(topicPoints).length) : 0;
        const estimatedQuizCount = Math.floor(totalTopicPoints / 100) || 1; // Estimate based on points
        const estimatedTotalQuestions = estimatedQuizCount * 10; // Estimate 10 questions per quiz
        const estimatedAccuracy = Math.min(95, Math.max(60, 70 + (playerData.score / 100))); // Estimate accuracy
        const maxCombo = Math.floor(playerData.score / 50) || 1; // Estimate max combo
        
        // Generate avatar initials
        const initials = playerData.name.split(' ').map(word => word[0]).join('').substring(0, 2).toUpperCase();
        
        // Update header information
        document.getElementById('player-avatar').textContent = initials;
        document.getElementById('profile-player-name').textContent = playerData.name;
        document.getElementById('profile-department').innerHTML = `
          <span class="inline-block w-6 h-4 bg-white rounded shadow"></span>
          ${playerData.department || 'Unknown'}
        `;
        
        // Update rankings (we'll calculate these properly later)
        document.getElementById('global-rank').textContent = '#' + (Math.floor(Math.random() * 1000) + 1);
        document.getElementById('dept-rank').textContent = '#' + (Math.floor(Math.random() * 100) + 1);
        
        // Update stats
        document.getElementById('ranked-score').textContent = playerData.score.toLocaleString();
        document.getElementById('accuracy').textContent = estimatedAccuracy.toFixed(1) + '%';
        document.getElementById('quiz-count').textContent = estimatedQuizCount;
        document.getElementById('total-score').textContent = (gameData.totalPoints || playerData.score).toLocaleString();
        document.getElementById('total-questions').textContent = estimatedTotalQuestions;
        document.getElementById('max-combo').textContent = maxCombo;
        document.getElementById('total-playtime').textContent = playTimeFormatted;
        
        // Generate level badges
        generateLevelBadges(gameData.achievementCount || 0);
        
        // Update main content area
        const content = document.getElementById('profile-content');
        content.innerHTML = `
          <!-- Badges Section -->
          <div class="bg-light p-6 rounded-lg">
            <h3 class="text-xl font-bold text-dark mb-4 flex items-center gap-2">
              <span class="text-primary">🏆</span>
              Badges & Achievements
            </h3>
            <div id="badges-container" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-4 min-h-[100px]">
              ${generateAchievementBadges(gameData.achievementCount || 0)}
            </div>
            ${(gameData.achievementCount || 0) === 0 ? '<p class="text-gray-500 text-center mt-4">No badges earned yet. Keep playing to unlock achievements!</p>' : ''}
          </div>

          <!-- Performance Charts Section -->
          <div class="grid lg:grid-cols-2 gap-6">
            <!-- Topic Performance Chart -->
            <div class="bg-light p-6 rounded-lg">
              <h3 class="text-lg font-semibold text-dark mb-4">Topic Performance</h3>
              ${Object.keys(topicPoints).length > 0 ? `
                <div class="relative h-64 mb-4">
                  <canvas id="topicChart"></canvas>
                </div>
                <div class="text-sm text-gray-600 text-center">
                  Best Topic: ${getBestTopic(topicPoints)} • Average: ${averageTopicScore} pts
                </div>
              ` : `
                <div class="h-64 flex items-center justify-center text-gray-500">
                  <div class="text-center">
                    <div class="text-4xl mb-2">📊</div>
                    <div>No topic data available</div>
                  </div>
                </div>
              `}
            </div>

            <!-- Score Analysis Chart -->
            <div class="bg-light p-6 rounded-lg">
              <h3 class="text-lg font-semibold text-dark mb-4">Score Analysis</h3>
              <div class="relative h-64 mb-4">
                <canvas id="scoreChart"></canvas>
              </div>
              <div class="text-sm text-gray-600 text-center">
                Total Contribution Analysis
              </div>
            </div>
          </div>

          <!-- Detailed Statistics -->
          <div class="grid lg:grid-cols-2 gap-6">
            <!-- Performance Metrics -->
            <div class="bg-light p-6 rounded-lg">
              <h3 class="text-lg font-semibold text-dark mb-4">Performance Radar</h3>
              <div class="relative h-64 mb-4">
                <canvas id="radarChart"></canvas>
              </div>
              <div class="text-sm text-gray-600 text-center">
                Overall performance across all metrics
              </div>
            </div>

            <!-- Course Progress -->
            ${gameData.courseProgress ? `
            <div class="bg-light p-6 rounded-lg">
              <h3 class="text-lg font-semibold text-dark mb-4">Course Progress</h3>
              <div class="relative h-64 mb-4">
                <canvas id="progressChart"></canvas>
              </div>
              <div class="text-sm text-gray-600 text-center">
                ${formatCourseProgress(gameData.courseProgress)}
              </div>
            </div>
            ` : `
            <div class="bg-light p-6 rounded-lg">
              <h3 class="text-lg font-semibold text-dark mb-4">Recent Activity</h3>
              <div class="space-y-3">
                <div class="flex items-center gap-3 p-3 bg-white rounded">
                  <div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center text-white font-bold">
                    ${playerData.score >= 1000 ? 'S' : playerData.score >= 500 ? 'A' : 'B'}
                  </div>
                  <div>
                    <div class="font-medium">Best Score Achieved</div>
                    <div class="text-sm text-gray-600">${submissionDate} • ${playerData.score} points</div>
                  </div>
                </div>
                <div class="text-center text-gray-500 mt-4">
                  More activity data will appear as you play more games!
                </div>
              </div>
            </div>
            `}
          </div>

          <!-- Topic Breakdown Table -->
          ${Object.keys(topicPoints).length > 0 ? `
          <div class="bg-light p-6 rounded-lg">
            <h3 class="text-lg font-semibold text-dark mb-4">Topic Performance Breakdown</h3>
            <div class="overflow-x-auto">
              <table class="w-full">
                <thead>
                  <tr class="border-b border-gray-300">
                    <th class="text-left py-2 px-4">Topic</th>
                    <th class="text-center py-2 px-4">Score</th>
                    <th class="text-center py-2 px-4">Percentage</th>
                    <th class="text-center py-2 px-4">Rank</th>
                  </tr>
                </thead>
                <tbody>
                  ${Object.entries(topicPoints)
                    .sort(([,a], [,b]) => b - a)
                    .map(([topic, points], index) => `
                    <tr class="border-b border-gray-100 hover:bg-gray-50">
                      <td class="py-3 px-4">
                        <div class="flex items-center gap-2">
                          <div class="w-3 h-3 rounded-full" style="background-color: ${getTopicColor(topic)}"></div>
                          <span class="font-medium">${formatTopicName(topic)}</span>
                        </div>
                      </td>
                      <td class="text-center py-3 px-4 font-bold text-primary">${points}</td>
                      <td class="text-center py-3 px-4">${((points / totalTopicPoints) * 100).toFixed(1)}%</td>
                      <td class="text-center py-3 px-4">
                        <span class="inline-block px-2 py-1 rounded text-sm ${index === 0 ? 'bg-yellow-100 text-yellow-800' : index < 3 ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-600'}">
                          #${index + 1}
                        </span>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
          ` : ''}

          <!-- Player Statistics Summary -->
          <div class="bg-light p-6 rounded-lg">
            <h3 class="text-lg font-semibold text-dark mb-4">Player Summary</h3>
            <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-4">
              <div class="bg-white p-4 rounded text-center">
                <div class="text-2xl font-bold text-primary">${playerData.score}</div>
                <div class="text-sm text-gray-600">Highest Score</div>
              </div>
              <div class="bg-white p-4 rounded text-center">
                <div class="text-2xl font-bold text-accent">${gameData.achievementCount || 0}</div>
                <div class="text-sm text-gray-600">Achievements</div>
              </div>
              <div class="bg-white p-4 rounded text-center">
                <div class="text-2xl font-bold text-dark">${Object.keys(topicPoints).length}</div>
                <div class="text-sm text-gray-600">Topics Mastered</div>
              </div>
              <div class="bg-white p-4 rounded text-center">
                <div class="text-2xl font-bold text-gray-700">${playTimeFormatted}</div>
                <div class="text-sm text-gray-600">Time Invested</div>
              </div>
            </div>
          </div>
        `;

        // Create charts after DOM is updated
        setTimeout(() => {
          createPlayerCharts(playerData, topicPoints, gameData);
        }, 100);
      }

      // Chart Creation Functions
      let activeCharts = []; // Track active charts for cleanup

      function createPlayerCharts(playerData, topicPoints, gameData) {
        // Destroy existing charts
        activeCharts.forEach(chart => {
          if (chart && typeof chart.destroy === 'function') {
            chart.destroy();
          }
        });
        activeCharts = [];

        // Create Topic Performance Chart (Doughnut)
        if (Object.keys(topicPoints).length > 0) {
          createTopicChart(topicPoints);
        }

        // Create Score Analysis Chart (Bar)
        createScoreChart(playerData, gameData);

        // Create Course Progress Chart (if data available)
        if (gameData.courseProgress) {
          createProgressChart(gameData.courseProgress);
        }

        // Create Performance Radar Chart
        createRadarChart(playerData, gameData, topicPoints);
      }

      function createTopicChart(topicPoints) {
        const ctx = document.getElementById('topicChart');
        if (!ctx) return;

        const topics = Object.keys(topicPoints);
        const scores = Object.values(topicPoints);
        
        // Generate colors for each topic
        const colors = generateChartColors(topics.length);

        const chart = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: topics.map(topic => formatTopicName(topic)),
            datasets: [{
              data: scores,
              backgroundColor: colors.backgrounds,
              borderColor: colors.borders,
              borderWidth: 2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'bottom',
                labels: {
                  padding: 15,
                  usePointStyle: true
                }
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    const label = context.label || '';
                    const value = context.parsed;
                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                    const percentage = ((value / total) * 100).toFixed(1);
                    return `${label}: ${value} pts (${percentage}%)`;
                  }
                }
              }
            }
          }
        });
        activeCharts.push(chart);
      }

      function createScoreChart(playerData, gameData) {
        const ctx = document.getElementById('scoreChart');
        if (!ctx) return;

        // Create score breakdown data
        const totalScore = playerData.score;
        const achievementBonus = (gameData.achievementCount || 0) * 100; // Estimate
        const baseScore = totalScore - achievementBonus;
        const timeBonus = Math.max(0, totalScore * 0.1); // Estimate

        const chart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['Base Score', 'Achievement Bonus', 'Time Bonus'],
            datasets: [{
              label: 'Score Breakdown',
              data: [baseScore, achievementBonus, timeBonus],
              backgroundColor: [
                'rgba(244, 206, 20, 0.8)',   // primary
                'rgba(55, 151, 119, 0.8)',   // accent
                'rgba(69, 71, 75, 0.8)'      // dark
              ],
              borderColor: [
                'rgb(244, 206, 20)',
                'rgb(55, 151, 119)',
                'rgb(69, 71, 75)'
              ],
              borderWidth: 2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: false
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    return `${context.label}: ${context.parsed.y} points`;
                  }
                }
              }
            },
            scales: {
              y: {
                beginAtZero: true,
                title: {
                  display: true,
                  text: 'Points'
                }
              }
            }
          }
        });
        activeCharts.push(chart);
      }

      function createProgressChart(courseProgress) {
        const ctx = document.getElementById('progressChart');
        if (!ctx) return;

        const courses = Object.keys(courseProgress);
        const completed = courses.map(course => courseProgress[course] ? 1 : 0);
        
        const chart = new Chart(ctx, {
          type: 'polarArea',
          data: {
            labels: courses.map(course => formatCourseName(course)),
            datasets: [{
              data: completed,
              backgroundColor: completed.map(status => 
                status ? 'rgba(55, 151, 119, 0.7)' : 'rgba(231, 76, 60, 0.7)'
              ),
              borderColor: completed.map(status => 
                status ? 'rgb(55, 151, 119)' : 'rgb(231, 76, 60)'
              ),
              borderWidth: 2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'bottom',
                labels: {
                  padding: 10,
                  usePointStyle: true
                }
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    const status = context.parsed ? 'Completed' : 'In Progress';
                    return `${context.label}: ${status}`;
                  }
                }
              }
            },
            scales: {
              r: {
                display: false
              }
            }
          }
        });
        activeCharts.push(chart);
      }

      function createRadarChart(playerData, gameData, topicPoints) {
        const ctx = document.getElementById('radarChart');
        if (!ctx) return;

        // Normalize values to 0-10 scale for radar chart
        const maxScore = Math.max(playerData.score, 1000);
        const maxAchievements = Math.max(gameData.achievementCount || 1, 10);
        const maxPlayTime = Math.max(gameData.playTime || 1, 7200); // 2 hours max
        const maxTopics = Math.max(Object.keys(topicPoints).length, 6);

        const normalizedScore = (playerData.score / maxScore) * 10;
        const normalizedAchievements = ((gameData.achievementCount || 0) / maxAchievements) * 10;
        const normalizedPlayTime = ((gameData.playTime || 0) / maxPlayTime) * 10;
        const normalizedTopics = (Object.keys(topicPoints).length / maxTopics) * 10;
        const normalizedConsistency = Object.keys(topicPoints).length > 0 ? 
          (Math.min(...Object.values(topicPoints)) / Math.max(...Object.values(topicPoints))) * 10 : 0;

        const chart = new Chart(ctx, {
          type: 'radar',
          data: {
            labels: ['Score', 'Achievements', 'Experience', 'Diversity', 'Consistency'],
            datasets: [{
              label: 'Performance Metrics',
              data: [normalizedScore, normalizedAchievements, normalizedPlayTime, normalizedTopics, normalizedConsistency],
              backgroundColor: 'rgba(244, 206, 20, 0.2)',
              borderColor: 'rgb(244, 206, 20)',
              borderWidth: 2,
              pointBackgroundColor: 'rgb(244, 206, 20)',
              pointBorderColor: '#fff',
              pointHoverBackgroundColor: '#fff',
              pointHoverBorderColor: 'rgb(244, 206, 20)'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: false
              }
            },
            scales: {
              r: {
                beginAtZero: true,
                max: 10,
                ticks: {
                  display: false
                }
              }
            }
          }
        });
        activeCharts.push(chart);
      }

      // Utility Functions for Charts
      function generateChartColors(count) {
        const baseColors = [
          { bg: 'rgba(244, 206, 20, 0.8)', border: 'rgb(244, 206, 20)' },   // primary
          { bg: 'rgba(55, 151, 119, 0.8)', border: 'rgb(55, 151, 119)' },   // accent
          { bg: 'rgba(69, 71, 75, 0.8)', border: 'rgb(69, 71, 75)' },       // dark
          { bg: 'rgba(52, 152, 219, 0.8)', border: 'rgb(52, 152, 219)' },   // blue
          { bg: 'rgba(155, 89, 182, 0.8)', border: 'rgb(155, 89, 182)' },   // purple
          { bg: 'rgba(231, 76, 60, 0.8)', border: 'rgb(231, 76, 60)' },     // red
        ];

        const backgrounds = [];
        const borders = [];

        for (let i = 0; i < count; i++) {
          const colorIndex = i % baseColors.length;
          backgrounds.push(baseColors[colorIndex].bg);
          borders.push(baseColors[colorIndex].border);
        }

        return { backgrounds, borders };
      }

      function formatCourseName(course) {
        return course.replace(/_/g, ' ')
                    .replace(/\b\w/g, l => l.toUpperCase());
      }

      // Additional helper functions for osu!-style profile
      function generateLevelBadges(achievementCount) {
        const levelContainer = document.getElementById('level-badges');
        levelContainer.innerHTML = '';
        
        // Generate level badges based on achievement count
        const levels = ['D', 'C', 'B', 'A', 'S', 'SS'];
        const currentLevel = Math.min(Math.floor(achievementCount / 2), levels.length - 1);
        
        for (let i = 0; i <= currentLevel; i++) {
          const badge = document.createElement('div');
          badge.className = `w-8 h-8 rounded-full flex items-center justify-center text-white text-sm font-bold ${
            i === currentLevel ? 'bg-primary' : 'bg-accent'
          }`;
          badge.textContent = levels[i];
          levelContainer.appendChild(badge);
        }
      }

      function generateAchievementBadges(achievementCount) {
        if (achievementCount === 0) {
          return `
            <div class="col-span-full flex items-center justify-center py-8 text-gray-400">
              <div class="text-center">
                <div class="text-4xl mb-2">🏆</div>
                <div>No badges yet</div>
                <div class="text-sm">Complete challenges to earn badges!</div>
              </div>
            </div>
          `;
        }

        const badges = [
          { name: 'First Steps', icon: '👶', description: 'Completed first quiz', color: 'bg-blue-500' },
          { name: 'Dedicated', icon: '⏰', description: 'Played for 1 hour', color: 'bg-green-500' },
          { name: 'Scholar', icon: '📚', description: 'Earned 1000 points', color: 'bg-purple-500' },
          { name: 'Combo Master', icon: '🔥', description: 'Achieved 50+ combo', color: 'bg-red-500' },
          { name: 'Multi-talented', icon: '🌟', description: 'Mastered 3+ topics', color: 'bg-yellow-500' },
          { name: 'Perfectionist', icon: '💯', description: 'Perfect quiz score', color: 'bg-pink-500' },
          { name: 'Speed Demon', icon: '⚡', description: 'Lightning fast answers', color: 'bg-indigo-500' },
          { name: 'Persistent', icon: '💪', description: 'Completed 10+ quizzes', color: 'bg-teal-500' },
          { name: 'Top Scorer', icon: '🏆', description: 'Reached leaderboard top 10', color: 'bg-orange-500' },
          { name: 'Legend', icon: '👑', description: 'Ultimate achievement', color: 'bg-gradient-to-r from-yellow-400 to-orange-500' }
        ];

        let badgeHTML = '';
        const earnedBadges = badges.slice(0, Math.min(achievementCount, badges.length));
        
        earnedBadges.forEach(badge => {
          badgeHTML += `
            <div class="group relative">
              <div class="w-16 h-16 ${badge.color} rounded-lg flex items-center justify-center text-white text-2xl shadow-lg transform transition-transform group-hover:scale-110 cursor-pointer">
                ${badge.icon}
              </div>
              <div class="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 px-2 py-1 bg-black text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap z-10">
                <div class="font-bold">${badge.name}</div>
                <div>${badge.description}</div>
              </div>
            </div>
          `;
        });

        // Add placeholder badges for future achievements
        const remainingSlots = Math.max(0, 6 - earnedBadges.length);
        for (let i = 0; i < remainingSlots; i++) {
          badgeHTML += `
            <div class="w-16 h-16 bg-gray-200 rounded-lg flex items-center justify-center text-gray-400 text-xl border-2 border-dashed border-gray-300">
              🔒
            </div>
          `;
        }

        return badgeHTML;
      }

      function getBestTopic(topicPoints) {
        if (Object.keys(topicPoints).length === 0) return 'None';
        const [bestTopic] = Object.entries(topicPoints).reduce((a, b) => a[1] > b[1] ? a : b);
        return formatTopicName(bestTopic);
      }

      function getTopicColor(topic) {
        const colors = {
          'python': '#3776ab',
          'java': '#f89820',
          'C': '#00599c',
          'C++': '#00599c',
          'C_plus_plus_': '#00599c',
          'C#': '#239120',
          'C_sharp_': '#239120',
          'csharp': '#239120',
          'webdesign': '#e34c26',
          'webDesign': '#e34c26',
          'javascript': '#f7df1e',
          'html': '#e34c26',
          'css': '#1572b6'
        };
        return colors[topic] || '#6b7280';
      }
      function restoreFirebaseKeys(obj) {
        if (!obj || typeof obj !== 'object') return {};
        
        const restored = {};
        for (const [key, value] of Object.entries(obj)) {
          const restoredKey = key
            .replace(/_sharp_/g, '#')
            .replace(/_plus_/g, '+')
            .replace(/_dot_/g, '.')
            .replace(/_dollar_/g, '$')
            .replace(/_slash_/g, '/')
            .replace(/_lbracket_/g, '[')
            .replace(/_rbracket_/g, ']');
          
          restored[restoredKey] = value;
        }
        return restored;
      }

      function formatTopicName(topic) {
        // Convert topic names to readable format
        const topicMap = {
          'C': 'C Programming',
          'C++': 'C++',
          'C#': 'C#',
          'csharp': 'C#',
          'java': 'Java',
          'python': 'Python',
          'webdesign': 'Web Design',
          'webDesign': 'Web Design'
        };
        return topicMap[topic] || topic.charAt(0).toUpperCase() + topic.slice(1);
      }

      function formatPlayTime(seconds) {
        if (!seconds || seconds === 0) return 'No data';
        
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        
        if (hours > 0) {
          return `${hours}h ${minutes}m`;
        } else if (minutes > 0) {
          return `${minutes}m`;
        } else {
          return `${seconds}s`;
        }
      }

      function formatCourseProgress(progress) {
        if (!progress || typeof progress !== 'object') return 'No data';
        
        const completed = Object.values(progress).filter(Boolean).length;
        const total = Object.keys(progress).length;
        
        if (total === 0) return 'No data';
        
        const percentage = Math.round((completed / total) * 100);
        return `${completed}/${total} courses (${percentage}%)`;
      }

      // Close modal when clicking outside
      document.getElementById('player-profile-modal').addEventListener('click', function(e) {
        if (e.target === this) {
          closePlayerProfile();
        }
      });

      // Close modal with Escape key
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          closePlayerProfile();
        }
      });

    </script>
