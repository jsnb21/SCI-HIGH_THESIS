    <!-- Optional: runtime Firebase config injected by CI. Safe to omit locally. -->
    <script>
      (function(){
        try {
          var s = document.createElement('script');
          s.src = 'config/firebase-init.js';
          s.onerror = function(){};
          document.currentScript.parentNode.insertBefore(s, document.currentScript);
        } catch {}
      })();
    </script>
    
    <!-- Firebase Config Manager FIRST -->
    <script src="config/firebase-config.js"></script>
    <!-- Firebase Compat SDKs (static order to avoid race) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <!-- Module preloader to make Vite bundle the game module and expose a runtime loader -->
    <script type="module">
      // This import will be rewritten by Vite in production builds
      window.__loadGame = async () => {
        const mod = await import('./src/game.js');
        return mod;
      };
    </script>
    <script>
      // Real accounts are authorized from Firebase state. Guest mode is explicitly unauthenticated.
      window.__authGatePromise = (async function () {
        const cached = (() => {
          try { return JSON.parse(localStorage.getItem('sci_high_user') || 'null'); } catch { return null; }
        })();
        const guestAllowed = sessionStorage.getItem('sci_high_guest') === 'true' && cached?.type === 'guest';
        if (guestAllowed) return { type: 'guest' };

        if (!window.firebaseConfig) throw new Error('Firebase configuration is unavailable');
        if (!window.firebaseConfig.isInitialized()) await window.firebaseConfig.initializeFirebase();

        const firebaseUser = await new Promise((resolve, reject) => {
          let settled = false;
          const timer = setTimeout(() => {
            if (settled) return;
            settled = true;
            unsubscribe();
            reject(new Error('Authentication check timed out'));
          }, 8000);
          const unsubscribe = firebase.auth().onAuthStateChanged(user => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            unsubscribe();
            resolve(user || null);
          }, reject);
        });

        if (!firebaseUser || firebaseUser.isAnonymous) throw new Error('A verified account is required');

        const token = await firebaseUser.getIdTokenResult(true);
        const claimedRole = String(token.claims?.role || '').toLowerCase();
        const privileged = token.claims?.admin === true || token.claims?.professor === true || claimedRole === 'admin' || claimedRole === 'professor';
        if (!privileged) {
          const [student, general] = await Promise.all([
            firebase.database().ref(`students/${firebaseUser.uid}`).once('value'),
            firebase.database().ref(`general_users/${firebaseUser.uid}`).once('value')
          ]);
          if (!student.exists() && !general.exists()) throw new Error('No authorized application profile exists for this account');
        }

        sessionStorage.setItem('sci_high_session_uid', firebaseUser.uid);
        return { type: privileged ? claimedRole || (token.claims.admin ? 'admin' : 'professor') : 'user', uid: firebaseUser.uid };
      })();
    </script>
    
  <link rel="stylesheet" href="public/assets/css/game.css" />
  </head>
  <body>
    <!-- Maintenance overlay -->
    <div id="maintenance-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);color:#fff;z-index:10002;align-items:center;justify-content:center;text-align:center;padding:20px;font-family: 'Orbitron', monospace;">
      <div>
  <img src="assets/img/logo/SCI-HIGH_LOGO.png" alt="SCI-HIGH" style="height:96px;margin-bottom:16px;filter:drop-shadow(0 0 8px rgba(244,206,20,0.35));" />
          <h2 style="font-size:28px;color:#F4CE14;margin-bottom:8px;">Under Maintenance</h2>
        <p id="maint-msg" style="opacity:.9;margin-bottom:8px;">Scheduled maintenance in progress.</p>
        <p id="maint-ends" style="opacity:.8;margin-bottom:16px;"></p>
        <button onclick="window.location.href='index.html'" style="background:linear-gradient(to right,#F4CE14,#FFD700);color:#1a1a2e;border:none;padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer;">Return to Home</button>
      </div>
    </div>
    <!-- Authentication overlay -->
    <div id="auth-overlay">
  <!-- Removed buko_productions branding logo -->
      <h2>Authentication Required</h2>
      <p>You need to be logged in to access the game</p>
      <button onclick="window.location.href='index.html'">Go to Login</button>
    </div>
    
    <!-- Orientation overlay for mobile portrait mode -->
    <div id="orientation-overlay">
      <div class="rotate-icon">📱</div>
  <h2>Rotate to Landscape</h2>
  <p>For the best experience, rotate your device to landscape first.</p>
  <button id="enable-landscape-btn" style="margin-top:16px;padding:10px 14px;border-radius:8px;border:none;background:#F4CE14;color:#222;font-weight:700;cursor:pointer">Enable Landscape</button>
    </div>
    
    <div id="game"></div>
    <!-- Debug notify button removed -->

    <script>
      // Robust loader that waits for the module preloader Vite rewrites in production
      async function loadGameBundle(){
        // Wait for the module preloader to define window.__loadGame
        for (let i = 0; i < 60; i++) { // up to ~6s
          if (typeof window.__loadGame === 'function') {
            try { return await window.__loadGame(); } catch (e) { console.error('loadGame via preloader failed', e); break; }
          }
          await new Promise(r => setTimeout(r, 100));
        }
        // Fallback: try dynamic import (dev or if preloader failed)
        try { return await import('./src/game.js'); } catch (e) { console.error('Fallback import failed', e); throw e; }
      }

      // Maintenance check - if active, block game
      (async function checkMaintenance(){
        try {
          if (!window.firebaseConfig) return; // config manager
          if (!window.firebaseConfig.isInitialized()) { await window.firebaseConfig.initializeFirebase(); }
          const snap = await firebase.database().ref('system/maintenance').once('value');
          const val = snap.val() || {};
          const now = Date.now();
          const startsAtMs = val.startsAtMs ?? (val.startsAt ? Date.parse(val.startsAt) : 0);
          const endsAtMs = val.endsAtMs ?? (val.endsAt ? Date.parse(val.endsAt) : 0);
          const active = !!(val.enabled && (!startsAtMs || now >= startsAtMs) && (!endsAtMs || now < endsAtMs));
          if (active) {
            const ov = document.getElementById('maintenance-overlay');
            const msg = document.getElementById('maint-msg');
            const ends = document.getElementById('maint-ends');
            if (msg) msg.textContent = val.message || 'Scheduled maintenance in progress.';
            if (ends && endsAtMs) ends.textContent = 'Ends: ' + new Date(endsAtMs).toLocaleString();
            if (ov) ov.style.display = 'flex';
          }
        } catch (e) {
          // non-blocking
          console.warn('Maintenance check failed:', e.message);
        }
      })();

      // Maintenance toast intentionally not shown on game page
      // Function to check if device is mobile
      function isMobileDevice() {
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
               (window.innerWidth <= 768 && window.innerHeight <= 1024);
      }

      // Function to handle orientation
      async function requestFullscreen(el) {
        if (!el) return false;
        try {
          if (el.requestFullscreen) { await el.requestFullscreen(); return true; }
          if (el.webkitRequestFullscreen) { await el.webkitRequestFullscreen(); return true; }
          if (el.msRequestFullscreen) { await el.msRequestFullscreen(); return true; }
        } catch {}
        return false;
      }

      async function tryEnableLandscape() {
        const container = document.getElementById('game');
        // Fullscreen first (often required for orientation lock permissions)
        await requestFullscreen(container);
        // Try lock
        try {
          if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock('landscape');
          }
        } catch {}
        // Re-evaluate state
        handleOrientation();
      }

      function handleOrientation() {
        const overlay = document.getElementById('orientation-overlay');
        const isMobile = isMobileDevice();
        const isPortrait = window.innerHeight > window.innerWidth;

        if (isMobile && isPortrait) {
          overlay.style.display = 'flex';
        } else {
          overlay.style.display = 'none';
        }
        setTimeout(() => { if (window.game?.scale) window.game.scale.refresh(); }, 50);
      }

      // Check orientation on load and resize
      window.addEventListener('load', handleOrientation);
      window.addEventListener('resize', handleOrientation);
      window.addEventListener('orientationchange', () => {
        setTimeout(handleOrientation, 100); // Small delay for orientation change
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
          handleOrientation();
        });
      }

      // Button: Enable Landscape
      document.addEventListener('click', (e) => {
        if (e.target && e.target.id === 'enable-landscape-btn') {
          tryEnableLandscape();
        }
      });

      // Refresh Phaser scale on fullscreen changes to prevent stretching when entering/exiting
      const refreshScale = () => { try { if (window.game?.scale) window.game.scale.refresh(); } catch {} };
      document.addEventListener('fullscreenchange', () => { setTimeout(refreshScale, 50); });
      document.addEventListener('webkitfullscreenchange', () => { setTimeout(refreshScale, 50); });
      document.addEventListener('msfullscreenchange', () => { setTimeout(refreshScale, 50); });

      // Initial state
      handleOrientation();
    </script>

    <script>
      // Load the game only if maintenance is NOT active
      document.addEventListener('DOMContentLoaded', () => {
      (async function loadGameWithMaintenanceGate() {
        try {
          await window.__authGatePromise;
        } catch (error) {
          console.warn('Game access denied:', error?.message || error);
          const overlay = document.getElementById('auth-overlay');
          if (overlay) overlay.style.display = 'flex';
          return;
        }

        const showOverlay = (val) => {
          try {
            const ov = document.getElementById('maintenance-overlay');
            const msg = document.getElementById('maint-msg');
            const ends = document.getElementById('maint-ends');
            if (msg) msg.textContent = (val && val.message) || 'Scheduled maintenance in progress.';
            const endsAtMs = val?.endsAtMs ?? (val?.endsAt ? Date.parse(val.endsAt) : 0);
            if (ends && endsAtMs) ends.textContent = 'Ends: ' + new Date(endsAtMs).toLocaleString();
            if (ov) ov.style.display = 'flex';
          } catch {}
        };

        try {
          if (!window.firebaseConfig) {
            // No config manager available; allow game to load to avoid hard block
            await import('./src/game.js');
            return;
          }
          if (!window.firebaseConfig.isInitialized()) {
            await window.firebaseConfig.initializeFirebase();
          }
          const snap = await firebase.database().ref('system/maintenance').once('value');
          const val = snap.val() || {};
          const now = Date.now();
          const startsAtMs = val.startsAtMs ?? (val.startsAt ? Date.parse(val.startsAt) : 0);
          const endsAtMs = val.endsAtMs ?? (val.endsAt ? Date.parse(val.endsAt) : 0);
          const active = !!(val.enabled && (!startsAtMs || now >= startsAtMs) && (!endsAtMs || now < endsAtMs));
          if (active) {
            showOverlay(val);
            return; // do not load game during maintenance
          }
          await loadGameBundle();
        } catch (e) {
          // On any failure to check maintenance, fail-open and load game
          try { await loadGameBundle(); } catch {}
        }
      })();
      });
    </script>
    <!-- Notification debug scripts removed after verification -->
  </body>
</html>
