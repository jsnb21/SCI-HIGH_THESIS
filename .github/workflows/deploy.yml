name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Permissions needed for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: docs/package.json
        
    - name: Install dependencies
      run: |
        cd docs
        npm ci
        
    - name: Inject AI key (runtime config)
      shell: bash
      run: |
        mkdir -p docs/config
        # Create a JS file that sets a global for immediate use
        cat << 'EOF' > docs/config/ai-key.js
        // Auto-generated at deploy time. Do not commit.
        window.SCI_HIGH = window.SCI_HIGH || {};
        window.SCI_HIGH.GOOGLE_AI_API_KEY = '${{ secrets.SCI_HIGH_GOOGLE_AI_API_KEY }}';
        // Keep aggregates off by default in public deploys; flip to true if desired
        window.SCI_HIGH.ALLOW_FIREBASE_AGGREGATE_SYNC = false;
        EOF
        
        # Additionally create env-config.json for fetch-based loading
        cat << 'EOF' > docs/config/env-config.json
        {
          "geminiApiKey": "${{ secrets.SCI_HIGH_GOOGLE_AI_API_KEY }}"
        }
        EOF

    - name: Build
      run: |
        cd docs
        npm run build
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './docs/dist'
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
