name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Permissions needed for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: docs/package.json
        
    - name: Install dependencies
      run: |
        cd docs
        npm ci
        
    - name: Build Development
      run: |
        cd docs
        npm run build:dev
        
    - name: Build Production
      run: |
        cd docs
        npm run build:prod
        
    - name: Prepare Deploy Structure
      run: |
        cd docs
        mkdir -p deploy-dist/dev
        # Deploy production to root (default access)
        cp -r dist-prod/* deploy-dist/
        # Deploy development to /dev/ subdirectory (developer access only)
        cp -r dist-dev/* deploy-dist/dev/
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './docs/deploy-dist'
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
