<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SCI-HIGH</title>
  <meta http-equiv="refresh" content="0; url=./index.html" />
    <script>window.__APP_BASE__ = '%BASE_URL%';</script>
  <link rel="stylesheet" href="public/assets/css/404.css" />
  <script>
    // GitHub Pages SPA redirect fallback
    (function(){
      var redirect = sessionStorage.getItem('redirect');
      if (redirect) {
        sessionStorage.removeItem('redirect');
        var path = redirect.replace(/\/+/, '/');
        if (path && path !== '/' && !path.endsWith('.html')) {
          // Map '/professor-dashboard' -> '/professor-dashboard.html'
          var maybe = path.replace(/\/$/, '') + '.html';
          window.location.replace(maybe);
          return;
        }
      }
      // Default
      window.location.replace('./index.html');
    })();
  </script>
</head>
<body>
  <div>
    <h1>Redirecting...</h1>
    <p>If you're not redirected, <a href="index.html">click here</a>.</p>
  </div>
</body>
</html>
