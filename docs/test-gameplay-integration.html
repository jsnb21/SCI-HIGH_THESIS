<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Gameplay Integration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #ffffff;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #0f4c75;
        }
        .log {
            background: #000;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
        button {
            background: linear-gradient(45deg, #3282b8, #bbe1fa);
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        button:hover {
            background: linear-gradient(45deg, #bbe1fa, #3282b8);
        }
        .form-group {
            margin: 10px 0;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #0f4c75;
            border-radius: 5px;
            background: #1a1a2e;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Gameplay Integration with Career Stats</h1>
        <p>This page simulates what happens after a gameplay session ends.</p>
        
        <!-- Simulate Student Data Entry -->
        <div class="form-group">
            <label>Student ID:</label>
            <input type="text" id="studentId" value="test_student_002" placeholder="Enter student ID">
        </div>
        
        <div class="form-group">
            <label>First Name:</label>
            <input type="text" id="firstName" value="Jane" placeholder="Enter first name">
        </div>
        
        <div class="form-group">
            <label>Last Name:</label>
            <input type="text" id="lastName" value="Doe" placeholder="Enter last name">
        </div>
        
        <div class="form-group">
            <label>Department:</label>
            <select id="department">
                <option value="STEM">STEM</option>
                <option value="ABM">ABM</option>
                <option value="HUMSS">HUMSS</option>
                <option value="Junior High">Junior High</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Strand/Year:</label>
            <input type="text" id="strandYear" value="Grade 11" placeholder="Enter strand/year">
        </div>
        
        <h3>📊 Simulated Gameplay Data</h3>
        <div class="form-group">
            <label>Course Topic:</label>
            <select id="courseTopic">
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="csharp">C#</option>
                <option value="cpp">C++</option>
                <option value="c">C</option>
                <option value="webdesign">Web Design</option>
            </select>
        </div>
        
        <button onclick="simulateGameplayEnd()">🎮 Simulate Gameplay Session End</button>
        <button onclick="checkCareerStats()">📈 Check Career Stats in Database</button>
        <button onclick="clearLog()">🗑️ Clear Log</button>
        
        <h3>📝 Console Log:</h3>
        <div id="log" class="log"></div>
    </div>

    <script type="module">
        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            const logDiv = document.getElementById('log');
            logDiv.textContent += `${timestamp} - ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        window.log = log;

        window.clearLog = () => {
            document.getElementById('log').textContent = '';
        };

        // Simulate what DataCollectionScreen does
        window.simulateGameplayEnd = async () => {
            try {
                log('🎮 Simulating gameplay session end...');
                
                // Get form data
                const studentId = document.getElementById('studentId').value;
                const firstName = document.getElementById('firstName').value;
                const lastName = document.getElementById('lastName').value;
                const department = document.getElementById('department').value;
                const strandYear = document.getElementById('strandYear').value;
                const courseTopic = document.getElementById('courseTopic').value;
                const fullName = `${firstName} ${lastName}`;
                
                // Generate realistic gameplay data
                const correctAnswers = Math.floor(Math.random() * 8) + 5; // 5-12
                const wrongAnswers = Math.floor(Math.random() * 3) + 1; // 1-3
                const totalScore = correctAnswers * 100 + Math.floor(Math.random() * 200);
                const highestStreak = Math.floor(Math.random() * correctAnswers) + 2;
                const sessionDuration = Math.floor(Math.random() * 300) + 120; // 2-7 minutes
                const accuracyPercentage = ((correctAnswers / (correctAnswers + wrongAnswers)) * 100);
                
                const gameplayData = {
                    studentId: studentId,
                    studentName: fullName,
                    firstName: firstName,
                    lastName: lastName,
                    department: department,
                    strandYear: strandYear,
                    courseTopic: courseTopic,
                    sessionData: {
                        correctAnswers: correctAnswers,
                        wrongAnswers: wrongAnswers,
                        highestStreak: highestStreak,
                        totalScore: totalScore,
                        intensity3CorrectAnswers: Math.floor(correctAnswers * 0.3),
                        courseCompleted: Math.random() > 0.7, // 30% chance of completion
                        sessionDuration: sessionDuration,
                        timestamp: new Date().toISOString(),
                        accuracyPercentage: parseFloat(accuracyPercentage.toFixed(1))
                    }
                };
                
                log('📊 Generated gameplay data:');
                log(JSON.stringify(gameplayData, null, 2));
                
                // Test career stats integration
                log('🔄 Attempting to import career stats service...');
                const { default: careerStatsService } = await import('./src/services/careerStatsService.js');
                log('✅ Career stats service imported successfully');
                
                log('🔄 Calling updateCareerStats...');
                const result = await careerStatsService.updateCareerStats(
                    gameplayData.studentId, 
                    fullName,
                    gameplayData.sessionData,
                    {
                        firstName: firstName,
                        lastName: lastName,
                        department: department,
                        strandYear: strandYear
                    }
                );
                
                log('✅ Career stats update result:');
                log(JSON.stringify(result, null, 2));
                
                log('🎉 Gameplay integration test completed successfully!');
                
            } catch (error) {
                log('❌ Error during gameplay integration test:');
                log(`❌ ${error.message}`);
                log(`❌ Stack: ${error.stack}`);
            }
        };

        // Check what's actually in the database
        window.checkCareerStats = async () => {
            try {
                log('🔍 Checking career stats in database...');
                
                const studentId = document.getElementById('studentId').value;
                
                const { default: careerStatsService } = await import('./src/services/careerStatsService.js');
                const stats = await careerStatsService.getCareerStats(studentId);
                
                if (stats) {
                    log('✅ Found career stats in database:');
                    log(JSON.stringify(stats, null, 2));
                } else {
                    log('⚠️ No career stats found for student: ' + studentId);
                }
                
            } catch (error) {
                log('❌ Error checking career stats:');
                log(`❌ ${error.message}`);
            }
        };
    </script>
</body>
</html>
