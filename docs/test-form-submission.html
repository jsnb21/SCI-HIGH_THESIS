<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test DataCollectionScreen Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #ffffff;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
        }
        .log {
            background: #000;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
        button {
            background: #3282b8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .test-form {
            background: #0a1628;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border: 2px solid #3282b8;
        }
        .test-form input, .test-form select {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            background: #1a1a2e;
            color: white;
            border: 1px solid #3282b8;
            border-radius: 5px;
        }
        .test-form label {
            display: block;
            margin: 10px 0 5px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test DataCollectionScreen Form Submission</h1>
        
        <!-- Test Form (mirrors DataCollectionScreen) -->
        <div class="test-form">
            <h3>📝 Student Information Form</h3>
            <label>First Name:</label>
            <input type="text" id="testFirstName" value="John" placeholder="Enter first name">
            
            <label>Last Name:</label>
            <input type="text" id="testLastName" value="Doe" placeholder="Enter last name">
            
            <label>Department:</label>
            <select id="testDepartment">
                <option value="">Select department...</option>
                <option value="Senior High School Department">Senior High School Department</option>
                <option value="College Department">College Department</option>
            </select>
            
            <label>Strand/Year:</label>
            <input type="text" id="testStrandYear" value="Grade 11 STEM" placeholder="Enter strand or year level">
            
            <button onclick="testFormSubmission()">🧪 Test Form Submission</button>
        </div>
        
        <button onclick="testCareerStatsImport()">1️⃣ Test Career Stats Import</button>
        <button onclick="simulateGameplayData()">2️⃣ Simulate Gameplay Data</button>
        <button onclick="testFullFlow()">3️⃣ Test Full Flow</button>
        <button onclick="checkLocalStorage()">4️⃣ Check localStorage</button>
        <button onclick="clearLog()">🗑️ Clear Log</button>
        
        <div id="log" class="log"></div>
    </div>

    <script type="module">
        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            const logDiv = document.getElementById('log');
            logDiv.textContent += `${timestamp} - ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        window.log = log;
        window.clearLog = () => { document.getElementById('log').textContent = ''; };

        // Set up mock localStorage user data
        const mockUserData = {
            studentId: 'test_student_004',
            uid: 'test_student_004',
            fullName: 'Test User'
        };
        localStorage.setItem('sci_high_user', JSON.stringify(mockUserData));
        log('🔧 Mock user data set in localStorage');

        window.testCareerStatsImport = async () => {
            try {
                log('🔄 Testing career stats service import...');
                const { default: careerStatsService } = await import('./src/services/careerStatsService.js');
                log('✅ Career stats service imported successfully!');
                log('🔧 Service methods: ' + Object.getOwnPropertyNames(Object.getPrototypeOf(careerStatsService)));
                return careerStatsService;
            } catch (error) {
                log('❌ Career stats import failed:');
                log(`❌ ${error.message}`);
                log(`❌ ${error.stack}`);
                return null;
            }
        };

        window.simulateGameplayData = () => {
            const gameplayData = {
                courseTopic: 'python',
                correctAnswers: 8,
                wrongAnswers: 2,
                highestStreak: 5,
                totalScore: 850,
                intensity3CorrectAnswers: 3,
                courseCompleted: false,
                startTime: Date.now() - 300000 // 5 minutes ago
            };
            
            log('📊 Simulated gameplay data:');
            log(JSON.stringify(gameplayData, null, 2));
            return gameplayData;
        };

        window.testFormSubmission = async () => {
            try {
                log('📝 Testing form submission process...');
                
                // Get form values (like DataCollectionScreen does)
                const firstName = document.getElementById('testFirstName').value.trim();
                const lastName = document.getElementById('testLastName').value.trim();
                const department = document.getElementById('testDepartment').value;
                const strandYear = document.getElementById('testStrandYear').value.trim();
                
                log('📋 Form values collected:', { firstName, lastName, department, strandYear });
                
                // Validation (like DataCollectionScreen does)
                const missingFields = [];
                if (!firstName) missingFields.push('First Name');
                if (!lastName) missingFields.push('Last Name');
                if (!department) missingFields.push('Department');
                if (!strandYear) missingFields.push('Strand/Year');
                
                if (missingFields.length > 0) {
                    log('❌ Validation failed - missing fields: ' + missingFields.join(', '));
                    return;
                }
                
                log('✅ Form validation passed');
                
                // Get student ID (like DataCollectionScreen does)
                let studentId = 'unknown';
                let currentUser = null;
                
                try {
                    const userDataStr = localStorage.getItem('sci_high_user');
                    if (userDataStr) {
                        currentUser = JSON.parse(userDataStr);
                        studentId = currentUser.studentId || currentUser.uid || 'unknown';
                    }
                } catch (e) {
                    log('⚠️ Could not parse user data from localStorage: ' + e.message);
                }
                
                const fullName = `${firstName} ${lastName}`;
                log('👤 Student info: ' + fullName + ' (ID: ' + studentId + ')');
                
                // Create session data (simulate gameplay)
                const mockGameplayData = simulateGameplayData();
                
                const sessionData = {
                    courseTopic: mockGameplayData.courseTopic, // Include courseTopic in sessionData
                    correctAnswers: mockGameplayData.correctAnswers,
                    wrongAnswers: mockGameplayData.wrongAnswers,
                    highestStreak: mockGameplayData.highestStreak,
                    totalScore: mockGameplayData.totalScore,
                    intensity3CorrectAnswers: mockGameplayData.intensity3CorrectAnswers || 0,
                    courseCompleted: mockGameplayData.courseCompleted,
                    sessionDuration: Date.now() - mockGameplayData.startTime,
                    timestamp: new Date().toISOString(),
                    accuracyPercentage: parseFloat(((mockGameplayData.correctAnswers / (mockGameplayData.correctAnswers + mockGameplayData.wrongAnswers)) * 100).toFixed(1))
                };
                
                log('📊 Session data prepared:', sessionData);
                
                // Test career stats update (like DataCollectionScreen does)
                log('🔄 Testing career stats service call...');
                const careerStatsService = await testCareerStatsImport();
                
                if (careerStatsService) {
                    const result = await careerStatsService.updateCareerStats(
                        studentId,
                        fullName,
                        sessionData,
                        {
                            firstName: firstName,
                            lastName: lastName,
                            department: department,
                            strandYear: strandYear
                        }
                    );
                    
                    log('✅ Career stats update successful!');
                    log('📊 Result: ' + JSON.stringify(result, null, 2));
                } else {
                    log('❌ Could not test career stats - import failed');
                }
                
            } catch (error) {
                log('❌ Form submission test failed:');
                log(`❌ ${error.message}`);
                log(`❌ ${error.stack}`);
            }
        };

        window.testFullFlow = async () => {
            log('🚀 Starting full DataCollectionScreen flow simulation...');
            await testFormSubmission();
        };

        window.checkLocalStorage = () => {
            log('🔍 Checking localStorage...');
            const userData = localStorage.getItem('sci_high_user');
            log('👤 User data: ' + userData);
            
            if (userData) {
                try {
                    const parsed = JSON.parse(userData);
                    log('👤 Parsed user: ' + JSON.stringify(parsed, null, 2));
                } catch (e) {
                    log('❌ Failed to parse user data: ' + e.message);
                }
            }
        };

        // Auto-start basic tests
        setTimeout(() => {
            log('🚀 Starting automatic tests...');
            checkLocalStorage();
        }, 1000);
    </script>
</body>
</html>
