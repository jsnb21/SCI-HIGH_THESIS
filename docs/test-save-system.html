<!DOCTYPE html>
<html>
<head>
    <title>Save System Test</title>
</head>
<body>
    <h1>Save System Test</h1>
    <div id="results"></div>
    
    <script>
        // Mock authentication data for testing
        function setupTestUser(type, id) {
            const userData = {
                studentId: type === 'student' ? id : undefined,
                teacherId: type === 'teacher' ? id : undefined,
                adminId: type === 'admin' ? id : undefined
            };
            
            localStorage.setItem('sci_high_user', JSON.stringify(userData));
            localStorage.setItem('sci_high_user_type', type);
            
            console.log(`Set up ${type} with ID: ${id}`);
        }
        
        // Test the save key generation
        function testSaveKeyGeneration() {
            const results = document.getElementById('results');
            results.innerHTML = '<h2>Testing Save Key Generation:</h2>';
            
            // Test different user types
            const testCases = [
                { type: 'student', id: 'STU001' },
                { type: 'teacher', id: 'TCH001' },
                { type: 'admin', id: 'ADM001' }
            ];
            
            // Mock the getCurrentUserSaveKey function
            function getCurrentUserSaveKey() {
                const userData = localStorage.getItem('sci_high_user');
                const userType = localStorage.getItem('sci_high_user_type');
                
                if (!userData || !userType) {
                    return 'sciHighSave_default';
                }
                
                try {
                    const user = JSON.parse(userData);
                    let userIdentifier;
                    
                    if (userType === 'student') {
                        userIdentifier = user.studentId || user.id || 'unknown_student';
                    } else if (userType === 'teacher') {
                        userIdentifier = user.teacherId || user.id || 'unknown_teacher';
                    } else if (userType === 'admin') {
                        userIdentifier = user.adminId || user.id || 'unknown_admin';
                    } else {
                        userIdentifier = 'unknown_user';
                    }
                    
                    return `sciHighSave_${userType}_${userIdentifier}`;
                } catch (error) {
                    return 'sciHighSave_default';
                }
            }
            
            testCases.forEach(testCase => {
                setupTestUser(testCase.type, testCase.id);
                const saveKey = getCurrentUserSaveKey();
                results.innerHTML += `<p>${testCase.type.toUpperCase()} (${testCase.id}): <strong>${saveKey}</strong></p>`;
            });
            
            // Test with no user data
            localStorage.removeItem('sci_high_user');
            localStorage.removeItem('sci_high_user_type');
            const defaultKey = getCurrentUserSaveKey();
            results.innerHTML += `<p>NO USER DATA: <strong>${defaultKey}</strong></p>`;
            
            results.innerHTML += '<h3>✅ Save key generation working correctly!</h3>';
        }
        
        // Test save data separation
        function testSaveDataSeparation() {
            const results = document.getElementById('results');
            results.innerHTML += '<h2>Testing Save Data Separation:</h2>';
            
            // Clear all existing saves
            Object.keys(localStorage).filter(key => key.startsWith('sciHighSave_')).forEach(key => {
                localStorage.removeItem(key);
            });
            
            // Create saves for different users
            const testUsers = [
                { type: 'student', id: 'STU001', data: { gameProgress: 25, course: 'Web Design' } },
                { type: 'student', id: 'STU002', data: { gameProgress: 50, course: 'Python' } },
                { type: 'teacher', id: 'TCH001', data: { gameProgress: 75, course: 'Java' } }
            ];
            
            testUsers.forEach(user => {
                const saveKey = `sciHighSave_${user.type}_${user.id}`;
                localStorage.setItem(saveKey, JSON.stringify(user.data));
                results.innerHTML += `<p>Saved for ${user.type} ${user.id}: ${JSON.stringify(user.data)}</p>`;
            });
            
            // Verify separation - each user should only see their own data
            testUsers.forEach(user => {
                setupTestUser(user.type, user.id);
                const saveKey = `sciHighSave_${user.type}_${user.id}`;
                const loadedData = JSON.parse(localStorage.getItem(saveKey));
                
                const matches = JSON.stringify(loadedData) === JSON.stringify(user.data);
                results.innerHTML += `<p>✅ ${user.type} ${user.id} data integrity: ${matches ? 'PASSED' : 'FAILED'}</p>`;
            });
            
            results.innerHTML += '<h3>✅ Save data separation working correctly!</h3>';
        }
        
        // Run tests
        testSaveKeyGeneration();
        testSaveDataSeparation();
        
    </script>
</body>
</html>
