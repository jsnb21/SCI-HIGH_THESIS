<!DOCTYPE html>
<html>
<head>
    <title>Firebase Connection Test</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>
    <h1>Firebase Connection Test</h1>
    <div id="status">Testing connection...</div>
    <div id="data"></div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyD-Q2woACHgMCTVwd6aX-IUzLovE0ux-28",
          authDomain: "sci-high-website.firebaseapp.com",
          databaseURL: "https://sci-high-website-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "sci-high-website",
          storageBucket: "sci-high-website.appspot.com",
          messagingSenderId: "451463202515",
          appId: "1:451463202515:web:e7f9c7bf69c04c685ef626"
        };

        try {
            // Initialize Firebase
            firebase.initializeApp(firebaseConfig);
            const database = firebase.database();
            
            document.getElementById('status').innerHTML = '✅ Firebase initialized successfully';
            
            // Test connection
            database.ref('.info/connected').on('value', (snapshot) => {
                if (snapshot.val() === true) {
                    document.getElementById('status').innerHTML = '✅ Connected to Firebase';
                } else {
                    document.getElementById('status').innerHTML = '❌ Disconnected from Firebase';
                }
            });
            
            // Try to read students data
            database.ref('students').once('value')
                .then(snapshot => {
                    const data = snapshot.val();
                    if (data) {
                        const count = Object.keys(data).length;
                        document.getElementById('data').innerHTML = `Found ${count} students in database`;
                        console.log('Student data:', data);
                    } else {
                        document.getElementById('data').innerHTML = 'No student data found';
                    }
                })
                .catch(error => {
                    document.getElementById('data').innerHTML = '❌ Error reading data: ' + error.message;
                    console.error('Firebase read error:', error);
                });
                
        } catch (error) {
            document.getElementById('status').innerHTML = '❌ Firebase initialization failed: ' + error.message;
            console.error('Firebase init error:', error);
        }
    </script>
</body>
</html>
